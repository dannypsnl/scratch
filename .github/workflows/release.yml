# Every push to main builds the app for every platform and publishes it as
# the one GitHub release, tagged `latest`: the release and tag of the build
# before are deleted and the tag made again on this commit, so only the
# build of the latest commit is kept.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  # a newer push makes this build moot
  cancel-in-progress: true

jobs:
  release:
    # macOS: the .app is signed ad hoc with codesign (scripts/bundle-mac.mjs);
    # neu builds the Linux and Windows binaries from here too
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # the Neutralino binaries (bin/) are not in the repository
      - run: npx neu update

      - run: npm run dist

      - name: Package
        run: |
          mkdir -p out
          for arch in arm64 x64; do
            ditto -c -k --keepParent "dist/mac_$arch/scratch.app" "out/scratch-mac_$arch.zip"
          done
          for arch in x64 arm64 armhf; do
            tar -czf "out/scratch-linux_$arch.tar.gz" -C dist/scratch "scratch-linux_$arch" -C ../mcp scratch-mcp.mjs
          done
          (cd dist/scratch && zip -q -j ../../out/scratch-win_x64.zip scratch-win_x64.exe ../mcp/scratch-mcp.mjs)
          ls -l out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./neutralino.config.json").version')
          tag=latest
          short=${GITHUB_SHA::7}
          gh release list --limit 1000 --json tagName -q '.[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
          # a tag left without its release would keep the old commit
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" 2>/dev/null || true
          gh release create "$tag" out/* \
            --target "$GITHUB_SHA" \
            --title "隨筆 $version (build $GITHUB_RUN_NUMBER, $short)" \
            --notes "Built from $short: $(git log -1 --format=%s)" \
            --latest
